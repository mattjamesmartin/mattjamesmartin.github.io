project:
  type: website
  output-dir: docs
  post-render:
  - touch docs/.nojekyll
  resources:
  - CNAME
  - imgs/**
  - research/**/*.pdf
  - teaching/**/*.pdf

author-meta:  "Matthew Martin"

website:
  title: "Matt Martin"
  favicon: favicon.svg
  google-analytics: "G-EL33VJN6EN"
  site-url: https://mattjmartin.com/
  repo-url: https://github.com/mattjamesmartin/mattjamesmartin.github.io

  open-graph:
    # Absolute URL so the card resolves the same on every page. A relative path
    # gets resolved per-page, breaking on anything outside the site root (e.g.
    # /research/ pointed at the nonexistent /research/imgs/social-card.png).
    image: "https://mattjmartin.com/imgs/social-card.png"
    image-width: 1200
    image-height: 630
    locale: en_US

  twitter-card:
    image: "https://mattjmartin.com/imgs/social-card.png"
    image-width: 1200
    image-height: 630
    creator: "@MattJ_Martin"
    card-style: summary_large_image

  # Navbar and footer colors live in _assets/mattjamesmartin.scss, which paints
  # both with `!important` rules — setting them here as well had no effect.
  navbar:
    pinned: true

    left:
      - text: "About"
        href: "index.qmd"
      - text: "Research"
        href: "research/index.qmd"
      - text: "Teaching"
        href: "teaching/index.qmd"
      - text: "CV"
        href: "cv/index.qmd"
      - text: "Blog"
        href: "blog/index.qmd"

    right:
      - text: "{{< iconify bi envelope-fill size=1.1em title='E-mail' >}}"
        href: "mailto:mattmartin@sc.edu"
      - text: "{{< iconify bi bluesky size=1em title='Bluesky' >}}"
        href: https://bsky.app/profile/mattjmartin.com
      - text: "{{< iconify bi github size=1.1em title='GitHub' >}}"
        href: https://github.com/mattjamesmartin
      - text: "{{< iconify bi linkedin size=1.1em title='LinkedIn' >}}"
        href: https://www.linkedin.com/in/mattj-martin/
      - text: "{{< iconify simple-icons orcid size=1.1em title='ORCID' >}}"
        href: https://orcid.org/0000-0003-3460-3603

  page-footer:
    left: |
      <p>{{< fa brands creative-commons >}} All content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)</p>
      <p>© 2023–2026 Matt Martin</p>
    center: |
      <p>Built with [Quarto](https://quarto.org/)</p>
      <p>View the source on [GitHub {{< fa brands github >}}]({{< var github-url >}})</p>
    right: |
      <p>Set in [Noto Sans](https://fonts.google.com/specimen/Noto+Sans)</p>
      <p>Last revised {{< today >}}</p>

format:
  html:
    theme:
      - _assets/mattjamesmartin.scss
    grid:
      body-width: 900px
    toc: false
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true

editor: visual
