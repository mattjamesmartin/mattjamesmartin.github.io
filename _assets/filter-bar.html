<script>
// Filter status bar for the Research and Blog listings (included from each
// page's front matter with `include-after-body`).
//
// Below 768px Quarto hides the margin column, and the Categories sidebar with
// it, but the tags under each entry still filter the list. That left phones
// with no sign that a filter was on and no "All" to tap. This adds a
// "Showing: <category> · Clear" line above the list; CSS shows it only at the
// widths where the sidebar is gone (.va-filterbar in mattjamesmartin.scss).
(function () {
  function decodeCat(raw) {
    if (!raw) return '';
    try { return decodeURIComponent(atob(raw)); } catch (e) { return raw; }
  }

  function start() {
    var sidebar = document.querySelector('.quarto-listing-category');
    var anchor = document.querySelector('main .va-sec');
    if (!sidebar || !anchor) return;

    // A <section>, not a <div>: the first section heading on these pages is
    // styled with `.va-sec:first-of-type`, which counts sibling divs, so a div
    // placed ahead of it would give that heading the rule and spacing meant
    // for later ones.
    var bar = document.createElement('section');
    bar.className = 'va-filterbar';
    bar.hidden = true;

    var status = document.createElement('span');
    status.setAttribute('role', 'status');
    var label = document.createElement('span');
    label.className = 'lbl';
    label.textContent = 'Showing: ';
    var name = document.createElement('span');
    name.className = 'name';
    status.appendChild(label);
    status.appendChild(name);

    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.setAttribute('aria-hidden', 'true');
    dot.textContent = '·';

    var clear = document.createElement('button');
    clear.type = 'button';
    clear.textContent = 'Clear';
    clear.setAttribute('aria-label', 'Clear category filter');
    clear.addEventListener('click', function () {
      // The empty category is Quarto's "All"; it takes the same base64 form as
      // any other, and base64 of the empty string is the empty string.
      if (window.quartoListingCategory) window.quartoListingCategory('');
    });

    bar.appendChild(status);
    bar.appendChild(dot);
    bar.appendChild(clear);
    anchor.parentNode.insertBefore(bar, anchor);

    function sync() {
      var active = sidebar.querySelector('.category.active');
      var cat = active ? decodeCat(active.dataset.category) : '';
      name.textContent = cat;
      bar.hidden = !cat;
    }

    // The bar sticks just under the fixed navbar, so it stays in view when a
    // tag is tapped far down the list. The navbar's height isn't exposed to
    // CSS, so hand it over here.
    function setOffset() {
      var header = document.getElementById('quarto-header');
      if (!header) return;
      // One pixel under the navbar's edge: its height can be fractional, and
      // an exact fit left a hairline gap that scrolling text showed through.
      var h = Math.floor(header.getBoundingClientRect().height) - 1;
      bar.style.setProperty('--va-header-h', h + 'px');
    }

    sync();
    setOffset();
    window.addEventListener('resize', setOffset);
    // Quarto marks the chosen category with .active, whether it came from a
    // tag, the sidebar, or a #category= link.
    new MutationObserver(sync).observe(sidebar, {
      attributes: true, attributeFilter: ['class'], subtree: true
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
